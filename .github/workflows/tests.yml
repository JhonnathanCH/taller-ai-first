name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads both the uv and the Python version from .tool-versions.
      # Pinned by commit: setup-uv stopped publishing major tags after v7.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: .tool-versions

      # --locked fails if uv.lock is out of date; dev group installs by default.
      - run: uv sync --locked

      - run: uv run pytest tests -q
